<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <title>BKS Resale Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>BKS Weekend incl. Campsite Resale Tracker</h1>

    <div class="stats">

        <div class="card">
            <h2 id="totalSold">-</h2>
            <p>Total Sold</p>
        </div>

        <div class="card">
            <h2 id="sold24h">-</h2>
            <p>Sold Last 24 Hours</p>
        </div>

    </div>

    <h2>Total Tickets Sold</h2>
    <canvas id="salesChart"></canvas>

    <script src="app.js"></script>

</body>
</html>
